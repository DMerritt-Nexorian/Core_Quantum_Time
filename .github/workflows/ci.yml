name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Test, and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Compile and Run Static Analysis (Clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit, Integration, and Property-Based Tests
        run: cargo test --all-targets --all-features

      - name: Verify Bare-Metal Compilation
        run: cargo check --target thumbv7em-none-eabi --all-features

      - name: Build Documentation
        run: cargo doc --no-deps --all-features
